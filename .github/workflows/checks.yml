name: checks

# Offline only: no GPU, no nodes, no model. This validates the parts of the
# repository that can be checked anywhere — the static validators, the benchmark
# tooling, the shell syntax and the compose file. The real acceptance gates
# (transport proof, near-1M) require hardware and are documented in the README.

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: python -m compileall -q scripts benchmarks tests

      - name: Validator tests
        run: python -m unittest tests.test_validators -v

      - name: Benchmark tooling tests
        run: python -m unittest discover -s benchmarks/scripts -p 'test_*.py' -v

      - name: Topology example is valid
        run: python scripts/validate-topology.py config/topology.env

      - name: Shell syntax
        run: |
          status=0
          while IFS= read -r script; do
            bash -n "$script" || status=1
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit "$status"

      - name: Compose file structure
        run: |
          # No YAML library is required: the checks below are structural and are
          # what the lifecycle scripts actually depend on. `docker compose config`
          # is deliberately avoided because it would try to interpolate the
          # per-rank .env values, which only exist on a real deployment.
          python - <<'PY'
          import re
          text = open("compose/compose.yaml", encoding="utf-8").read()
          required = [
              "pull_policy: never",
              "network_mode: host",
              "ipc: host",
              "cgroup_parent:",
              "restart: \"no\"",
              "/dev/infiniband:/dev/infiniband",
              "/opt/switchless-nccl:/opt/switchless-nccl:ro",
              "env_file:",
              "- ../config/vllm.env",
              "--tensor-parallel-size \"${TENSOR_PARALLEL_SIZE}\"",
              "--max-model-len \"${MAX_MODEL_LEN}\"",
              "--speculative-config \"${SPECULATIVE_CONFIG}\"",
          ]
          missing = [item for item in required if item not in text]
          assert not missing, f"compose is missing: {missing}"
          for name in ("NODE_RANK", "MASTER_ADDR", "VLLM_HOST_IP", "NCCL_IB_HCA", "CONTROL_IFACE"):
              assert re.search(rf"\$\{{{name}[:\-]", text), f"{name} is not parameterized"
          assert "# " in text, "compose lost its explanatory comments"
          print("compose OK")
          PY

      - name: No obvious private material
        run: |
          status=0
          for pattern in 'git\.home' 'dgx-[0-9]' '192\.168\.161' 'nas-dts' '/volume1/' \
                         'forgejo' 'BEGIN .*PRIVATE KEY' 'gh[pous]_[A-Za-z0-9]' \
                         'AI-Compute' 'AI-DMZ' 'litellm' 'open-webui' 'vaultwarden'; do
            if grep -rInE "$pattern" --exclude-dir=.git --exclude=checks.yml .; then
              echo "::error::private material pattern '$pattern' found"
              status=1
            fi
          done
          exit "$status"
