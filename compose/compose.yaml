# DeepSeek V4.1 Flash — one rank of a four-node switchless TP4 deployment.
#
# The same file runs on every rank. Per-rank values are supplied by the
# generated `compose/.env` on each host (scripts/start.sh writes it from
# config/topology.env), while config/vllm.env holds the values that are
# identical everywhere.
#
# Run with:
#   docker compose --env-file compose/.env -f compose/compose.yaml up -d
#
#   docker compose -f compose/compose.yaml up -d   (with .env in the same dir)

services:
  vllm:
    image: ${IMAGE:?IMAGE must be set (see compose/.env)}
    pull_policy: never
    container_name: ${CONTAINER_NAME:-deepseek-v4.1-vllm}
    entrypoint: []
    command:
      - bash
      - -lc
      - |-
        export PATH="/usr/local/cuda/bin:$${PATH}"; \
        export CUDA_HOME="/usr/local/cuda"; \
        export CUDA_PATH="$${CUDA_HOME}"; \
        exec /usr/local/bin/vllm serve "${MODEL_MOUNT_PATH}" \
        --served-model-name "${SERVED_MODEL_NAME}" \
        --host 0.0.0.0 \
        --port "${API_PORT}" \
        --trust-remote-code \
        --distributed-executor-backend mp \
        --nnodes "${NUM_NODES}" \
        --node-rank "${NODE_RANK}" \
        --master-addr "${MASTER_ADDR}" \
        --master-port "${MASTER_PORT}" \
        --tensor-parallel-size "${TENSOR_PARALLEL_SIZE}" \
        --pipeline-parallel-size "${PIPELINE_PARALLEL_SIZE}" \
        --kv-cache-dtype "${KV_CACHE_DTYPE}" \
        --block-size "${BLOCK_SIZE}" \
        --max-model-len "${MAX_MODEL_LEN}" \
        --max-num-seqs "${MAX_NUM_SEQS}" \
        --max-num-batched-tokens "${MAX_NUM_BATCHED_TOKENS}" \
        --max-cudagraph-capture-size "${MAX_CUDAGRAPH_CAPTURE_SIZE}" \
        --gpu-memory-utilization "${GPU_MEMORY_UTILIZATION}" \
        --compilation-config "${COMPILATION_CONFIG}" \
        --scheduling-policy "${SCHEDULING_POLICY}" \
        --speculative-config "${SPECULATIVE_CONFIG}" \
        --enable-prefix-caching \
        --async-scheduling \
        --enable-chunked-prefill \
        --tokenizer-mode "${TOKENIZER_MODE}" \
        --tool-call-parser "${TOOL_CALL_PARSER}" \
        --enable-auto-tool-choice \
        --reasoning-parser "${REASONING_PARSER}" \
        --reasoning-config "{\"reasoning_parser\":\"${REASONING_PARSER}\",\"reasoning_start_str\":\" thinking\",\"reasoning_end_str\":\" response\"}" \
        --default-chat-template-kwargs '{"thinking":false}' \
        --generation-config vllm \
        --enable-flashinfer-autotune \
        --jit-monitor-mode warn$${HEADLESS_SUFFIX}
    network_mode: host
    ipc: host
    shm_size: 64gb

    # The container is placed BELOW a systemd memory slice so the limit covers
    # the container, its pinned host memory and the tested CUDA/unified-memory
    # charges. See docs/safety.md and scripts/install-memory-boundary.sh.
    cgroup_parent: ${MEMORY_SLICE:?MEMORY_SLICE must be set (see compose/.env)}

    restart: "no"
    ulimits:
      memlock: -1
      stack: 67108864
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband
    volumes:
      - ${MODEL_ROOT}:${MODEL_MOUNT_PATH}:ro
      - ${CACHE_ROOT}:/var/cache/vllm
      - ${WORKLOAD_ROOT}/tmp:/tmp
      # The ring-only NCCL 2.30.7 build verified by scripts/verify-cluster.sh.
      - /opt/switchless-nccl:/opt/switchless-nccl:ro
      # Disk-backed Engram: the upstream patches are staged on the host by
      # scripts/fetch-engram-patches.sh and mounted over the runtime copies.
      - ${ENGRAM_PATCH_DIR}/engram.py:${SITE:-/usr/local/lib/python3.12/dist-packages}/vllm/models/deepseek_v4_1/common/engram.py:ro
      - ${ENGRAM_PATCH_DIR}/model_state.py:${SITE:-/usr/local/lib/python3.12/dist-packages}/vllm/models/deepseek_v4_1/nvidia/model_state.py:ro
      - ${ENGRAM_PATCH_DIR}/weight_utils.py:${SITE:-/usr/local/lib/python3.12/dist-packages}/vllm/model_executor/model_loader/weight_utils.py:ro
      - ${ENGRAM_PATCH_DIR}/attention.py:${SITE:-/usr/local/lib/python3.12/dist-packages}/vllm/models/deepseek_v4_1/attention.py:ro
      - ${ENGRAM_PATCH_DIR}/flashinfer_sparse.py:${SITE:-/usr/local/lib/python3.12/dist-packages}/vllm/models/deepseek_v4_1/nvidia/flashinfer_sparse.py:ro
      - ${ENGRAM_PATCH_DIR}/sparse_swa.py:${SITE:-/usr/local/lib/python3.12/dist-packages}/vllm/v1/attention/backends/mla/sparse_swa.py:ro
      - ${ENGRAM_PATCH_DIR}/sparse_attn_indexer.py:${SITE:-/usr/local/lib/python3.12/dist-packages}/vllm/model_executor/layers/sparse_attn_indexer.py:ro
    env_file:
      - ../config/vllm.env
    environment:
      # Per-rank / per-host values come from compose/.env so the same compose
      # file is correct on every node.
      NODE_RANK: ${NODE_RANK:?NODE_RANK must be set (see compose/.env)}
      MASTER_ADDR: ${MASTER_ADDR:?MASTER_ADDR must be set (see compose/.env)}
      VLLM_HOST_IP: ${VLLM_HOST_IP:?VLLM_HOST_IP must be set (see compose/.env)}
      NCCL_IB_HCA: ${NCCL_IB_HCA:?NCCL_IB_HCA must be set (see compose/.env)}
      NCCL_SOCKET_IFNAME: "=${CONTROL_IFACE:?CONTROL_IFACE must be set (see compose/.env)}"
      TP_SOCKET_IFNAME: ${CONTROL_IFACE}
      GLOO_SOCKET_IFNAME: ${CONTROL_IFACE}
      # "--headless" on ranks 1..N-1, empty on the head. Empty is valid; the
      # shell inside the container expands it into the command line above.
      HEADLESS_SUFFIX: ${HEADLESS_SUFFIX:-}
